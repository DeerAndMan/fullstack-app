# 配置模板 — 复制为 config.yaml 后修改为本地实际值
# cp config.example.yaml config.yaml
# config.yaml 已被 .gitignore 排除，不会提交到仓库

server:
  port: 6767
  mode: debug

mysql:
  host: 127.0.0.1
  port: 3306
  username: app
  password: app123
  database: energytest
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "change-me-in-production-use-a-strong-secret"
  access_expire: 24
  refresh_expire: 168
  issuer: "fullstack-app"

upload:
  path: "./uploads"
  max_size: 10
  allow_exts:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".pdf"
    - ".xlsx"

cors:
  allow_origins:
    - "http://localhost:6565"
    - "http://127.0.0.1:6565"
    - "http://localhost:7878"
    - "http://127.0.0.1:7878"
